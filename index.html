<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة التفاعلات الكيميائية - وزارة التعليم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 95%;
            max-width: 1000px;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #1a2a6c;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        
        .progress-container {
            background: #f0f0f0;
            height: 10px;
            width: 100%;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .quiz-content {
            padding: 30px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .question-container {
            margin-bottom: 30px;
        }
        
        .question-number {
            font-size: 14px;
            color: #b21f1f;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .question {
            font-size: 20px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        
        .option:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }
        
        .option.selected {
            background: #d4edda;
            border-color: #1a2a6c;
        }
        
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }
        
        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }
        
        .option-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background: #1a2a6c;
            color: white;
            border-radius: 50%;
            margin-left: 10px;
            font-weight: bold;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        button {
            background: linear-gradient(to right, #1a2a6c, #b21f1f);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .result-container {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }
        
        .result-title {
            font-size: 32px;
            margin-bottom: 20px;
            color: #1a2a6c;
        }
        
        .score {
            font-size: 72px;
            font-weight: bold;
            color: #b21f1f;
            margin: 20px 0;
        }
        
        .score-text {
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .feedback {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: right;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .timer {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .medal {
            font-size: 80px;
            margin: 20px 0;
        }
        
        .question-jump {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .question-jump-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e9ecef;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .question-jump-btn:hover {
            background: #dee2e6;
        }
        
        .question-jump-btn.answered {
            background: #1a2a6c;
            color: white;
        }
        
        .question-jump-btn.current {
            background: #b21f1f;
            color: white;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 22px;
            }
            
            .question {
                font-size: 18px;
            }
            
            .quiz-content {
                padding: 20px;
            }
            
            .medal {
                font-size: 60px;
            }
            
            .question-jump-btn {
                width: 35px;
                height: 35px;
                font-size: 14px;
            }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 1s infinite;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #1a2a6c;
        }
        
        .stat-label {
            font-size: 14px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">

        </div>

        </div>

                <div class="stat-item">

            </div>

            <div class="feedback" id="feedback">
                <!-- سيتم ملء التقييم ديناميكيًا -->
            </div>
        </div>
    </div>

                correctAnswer: 0,
                explanation: "التسامي هو تحول المادة من الحالة الصلبة إلى الحالة الغازية مباشرة دون المرور بالحالة السائلة."

            {
                question: "أي من الأحماض التالية يوجد في المعدة؟",
                options: [

                    "حمض الخليك"

                correctAnswer: 0,
                explanation: "المعدة تفرز حمض الهيدروكلوريك الذي يساعد في هضم الطعام وقتل البكتيريا."
            },
            {
                question: "ما هو الرمز الكيميائي للفضة؟",
                options: [
                    "Ag",
                    "Au",
                    "Fe",

                ],
                correctAnswer: 0,
                explanation: "الرمز الكيميائي للفضة هو Ag من الكلمة اللاتينية Argentum."

        // تهيئة المتغيرات
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let score = 0;
        let timeLeft = 1800; // 30 دقيقة بالثواني
        let timerInterval;
        let startTime;

        // عناصر DOM
        const quizContent = document.getElementById('quiz-content');
        const resultContainer = document.getElementById('result-container');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const currentQuestionElement = document.getElementById('current-question');
        const totalQuestionsElement = document.getElementById('total-questions');
        const progressBar = document.getElementById('progress-bar');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreElement = document.getElementById('score');
        const scoreTextElement = document.getElementById('score-text');
        const feedbackElement = document.getElementById('feedback');
        const timerElement = document.getElementById('timer');
        const medalElement = document.getElementById('medal');
        const questionJumpElement = document.getElementById('question-jump');
        const correctAnswersElement = document.getElementById('correct-answers');
        const wrongAnswersElement = document.getElementById('wrong-answers');
        const timeTakenElement = document.getElementById('time-taken');

        // تهيئة المسابقة
        function initQuiz() {
            totalQuestionsElement.textContent = questions.length;
            updateProgressBar();
            startTimer();
            createQuestionJumpButtons();
            showQuestion();
            startTime = new Date();
        }

        // إنشاء أزرار القفز بين الأسئلة
        function createQuestionJumpButtons() {
            questionJumpElement.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const button = document.createElement('div');
                button.classList.add('question-jump-btn');
                if (i === currentQuestionIndex) {
                    button.classList.add('current');
                } else if (userAnswers[i] !== null) {
                    button.classList.add('answered');
                }
                button.textContent = i + 1;
                button.addEventListener('click', () => {
                    currentQuestionIndex = i;
                    showQuestion();
                    updateProgressBar();
                    updateQuestionJumpButtons();
                });
                questionJumpElement.appendChild(button);
            }
        }

        // تحديث أزرار القفز بين الأسئلة
        function updateQuestionJumpButtons() {
            const buttons = questionJumpElement.querySelectorAll('.question-jump-btn');
            buttons.forEach((button, index) => {
                button.classList.remove('current', 'answered');
                if (index === currentQuestionIndex) {
                    button.classList.add('current');
                } else if (userAnswers[index] !== null) {
                    button.classList.add('answered');
                }
            });
        }

        // بدء المؤقت
        function startTimer() {
            clearInterval(timerInterval);
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endQuiz();
                }
            }, 1000);
        }

        // تحديث عرض المؤقت
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `⏱ ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft < 300) { // أقل من 5 دقائق
                timerElement.style.color = '#b21f1f';
                timerElement.classList.add('pulse');
            }
        }

        // عرض السؤال الحالي
        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            questionElement.textContent = currentQuestion.question;
            currentQuestionElement.textContent = currentQuestionIndex + 1;
            
            // إضافة الخيارات بشكل عشوائي
            optionsContainer.innerHTML = '';
            const shuffledOptions = [...currentQuestion.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.classList.add('option');
                if (userAnswers[currentQuestionIndex] === index) {
                    optionElement.classList.add('selected');
                }
                
                optionElement.innerHTML = `
                    ${option}
                    <span class="option-letter">${String.fromCharCode(65 + index)}</span>
                `;
                
                optionElement.addEventListener('click', () => selectOption(index));
                optionsContainer.appendChild(optionElement);
            });
            
            // تحديث حالة الأزرار
            updateButtons();
            updateQuestionJumpButtons();
        }

        // اختيار إجابة
        function selectOption(optionIndex) {
            userAnswers[currentQuestionIndex] = optionIndex;
            showQuestion();
        }

        // تحديث حالة أزرار التنقل
        function updateButtons() {
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'block';
                submitBtn.style.display = 'none';
            }
        }

        // تحديث شريط التقدم
        function updateProgressBar() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        // الانتقال إلى السؤال التالي
        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                showQuestion();
                updateProgressBar();
            }
        });

        // الانتقال إلى السؤال السابق
        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion();
                updateProgressBar();
            }
        });

        // إنهاء المسابقة وعرض النتائج
        submitBtn.addEventListener('click', endQuiz);

        function endQuiz() {
            clearInterval(timerInterval);
            calculateScore();
            showResults();
        }

        // حساب النتيجة
        function calculateScore() {
            score = 0;
            questions.forEach((question, index) => {
                if (userAnswers[index] === question.correctAnswer) {
                    score++;
                }
            });
        }

        // عرض النتائج
        function showResults() {
            quizContent.style.display = 'none';
            resultContainer.style.display = 'block';
            
            const percentage = Math.round((score / questions.length) * 100);
            scoreElement.textContent = `${percentage}%`;
            
            // حساب الوقت المستغرق
            const endTime = new Date();
            const timeTaken = Math.round((endTime - startTime) / 1000);
            const minutes = Math.floor(timeTaken / 60);
            const seconds = timeTaken % 60;
            timeTakenElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            // تحديث الإحصائيات
            correctAnswersElement.textContent = score;
            wrongAnswersElement.textContent = questions.length - score;
            
            // نص التقييم بناءً على النتيجة
            let feedbackText = '';
            let medal = '🥉';
            
            if (percentage >= 90) {
                scoreTextElement.textContent = 'ممتاز! أنت خبير في الكيمياء!';
                feedbackText = 'أظهرت فهمًا عميقًا لمبادئ التفاعلات الكيميائية. يمكنك بسهولة متابعة دراسة متقدمة في هذا المجال.';
                medal = '🥇';
            } else if (percentage >= 70) {
                scoreTextElement.textContent = 'جيد جدًا! لديك معرفة قوية بالكيمياء.';
                feedbackText = 'أظهرت معرفة جيدة بأنواع التفاعلات الكيميائية وآلياتها. يمكنك تحسين أدائك بالمزيد من الممارسة.';
                medal = '🥈';
            } else if (percentage >= 50) {
                scoreTextElement.textContent = 'مستوى مقبول! يمكنك تحسين أدائك.';
                feedbackText = 'لديك فهم أساسي للتفاعلات الكيميائية، لكن تحتاج إلى مراجعة بعض المفاهيم لتحسين أدائك.';
                medal = '🥉';
            } else {
                scoreTextElement.textContent = 'يحتاج إلى تحسين! راجع مفاهيم الكيمياء الأساسية.';
                feedbackText = 'يبدو أنك تحتاج إلى مراجعة أساسيات التفاعلات الكيميائية. ننصحك بالعودة إلى المواد الدراسية والمزيد من التمارين.';
                medal = '📚';
            }
            
            medalElement.textContent = medal;
            
            // إضافة شرح للإجابات
            feedbackText += '<h3 style="margin-top: 20px; margin-bottom: 10px;">شرح الإجابات:</h3>';
            questions.forEach((question, index) => {
                const userAnswerIndex = userAnswers[index];
                const isCorrect = userAnswerIndex === question.correctAnswer;
                const answerStatus = isCorrect ? '✓' : '✗';
                const answerClass = isCorrect ? 'correct' : 'incorrect';
                
                feedbackText += `
                    <div style="margin-bottom: 15px; padding: 10px; border-radius: 5px; background: ${isCorrect ? '#d4edda' : '#f8d7da'};">
                        <strong>السؤال ${index + 1}:</strong> ${question.question}<br>
                        <strong>إجابتك:</strong> <span class="${answerClass}">${answerStatus} ${question.options[userAnswerIndex] || 'لم تجب'}</span><br>
                        <strong>الإجابة الصحيحة:</strong> ${question.options[question.correctAnswer]}<br>
                        <strong>التفسير:</strong> ${question.explanation}
                    </div>
                `;
            });
            
            feedbackElement.innerHTML = feedbackText;
        }

        // إعادة بدء المسابقة
        restartBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            userAnswers = new Array(questions.length).fill(null);
            score = 0;
            timeLeft = 1800;
            
            quizContent.style.display = 'block';
            resultContainer.style.display = 'none';
            timerElement.classList.remove('pulse');
            timerElement.style.color = 'white';
            
            initQuiz();
        });

        // بدء المسابقة عند تحميل الصفحة
        window.onload = initQuiz;
    </script>
